# Supabase CLI config for local development (`supabase start`).
project_id = "game-party-extravaganza"

[api]
enabled = true
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "200KiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
# Every device signs in anonymously (SRD §8).
enable_anonymous_sign_ins = true

[auth.rate_limit]
# A whole party (and a 50-person audience) usually shares one IP.
anonymous_users = 300

[functions.cleanup-rooms]
# Authenticated by the x-cleanup-token header instead of a JWT.
verify_jwt = false
